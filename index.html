<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Tool Box - Minha caixa de Ferramentas</title>
  <meta name="description" content="Minha caixa de ferramentas prática com utilitários de texto, conversão CSV, formatadores SQL e manipulação de código.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
  <link rel="icon" type="image/png" href="images/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="images/favicon//favicon.svg" />
  <link rel="shortcut icon" href="images/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="images/favicon/apple-touch-icon.png" />
  <link rel="manifest" href="images/favicon/site.webmanifest" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased font-sans selection:bg-indigo-500 selection:text-white">

  <!-- Header Top Bar -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <i data-lucide="wrench" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
            Dev Tool Box
            <span class="text-[10px] uppercase font-mono px-2 py-0.5 rounded bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">v1.1.0</span>
          </h1>
          <p class="text-xs text-slate-400">Minha caixa de Ferramentas</p>
        </div>
      </div>

      <!-- Header Status -->
      <div class="flex items-center gap-4">
        <a href="https://github.com/rafanthx13/dev-tool-box" target="_blank" rel="noopener noreferrer" class="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors" title="Repositório GitHub">
          <i data-lucide="github" class="w-5 h-5"></i>
        </a>
      </div>
    </div>
  </header>

  <!-- Main Workspace Layout -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 flex flex-col md:flex-row gap-6 w-full">
    
    <!-- Sidebar Navigation -->
    <aside class="w-full md:w-72 flex-shrink-0 space-y-4">
      
      <!-- Search Input -->
      <div class="relative">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
        <input type="text" id="toolSearch" placeholder="Buscar ferramenta..." class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-9 pr-4 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
      </div>

      <!-- Tools Navigation List -->
      <nav id="toolsNav" class="space-y-1 bg-slate-900/50 border border-slate-800/80 rounded-2xl p-2 max-h-[calc(100vh-180px)] overflow-y-auto">
        <!-- Dynamically populated by main.js -->
      </nav>

      <!-- External Quick Links -->
      <div class="bg-slate-900/40 border border-slate-800/60 rounded-2xl p-3 space-y-2">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block px-2">Links Úteis Externos</span>
        <div class="grid grid-cols-1 gap-1 text-xs">
          <a href="https://www.tablesgenerator.com/markdown_tables" target="_blank" rel="noopener noreferrer" class="px-2 py-1.5 text-slate-400 hover:text-indigo-300 hover:bg-slate-800/50 rounded-lg flex items-center justify-between transition-colors">
            <span>Gerador de Tabelas MD</span>
            <i data-lucide="external-link" class="w-3 h-3"></i>
          </a>
        </div>
      </div>
    </aside>

    <!-- Main Tool Container -->
    <main class="flex-1 bg-slate-900/60 border border-slate-800 rounded-2xl p-6 shadow-xl min-h-[500px]">
      <div id="activeToolContainer">
        <!-- Active tool rendered here -->
      </div>
    </main>
  </div>

  <!-- Footer -->
  <footer class="border-t border-slate-800/60 bg-slate-950 py-4 mt-auto text-center text-xs text-slate-500">
    <p>Dev Tool Box &bull; Minha caixa de Ferramentas &bull; Feito com ⚡🔥💢</p>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
